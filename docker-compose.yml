services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: guide
      POSTGRES_USER: guide
      POSTGRES_PASSWORD: guide
    ports:
      - "55433:5432"
    volumes:
      - guide-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guide -d guide"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  guide-postgres-data:
